name: Documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
          package_json_file: docs-site/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: docs-site/pnpm-lock.yaml
      - name: Install Rust 1.96.0
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup component add rust-docs --toolchain 1.96.0
      - name: Generate RustDoc
        run: cargo +1.96.0 doc --locked --no-deps --document-private-items --target-dir docs-site/.generated/rustdoc
      - name: Publish RustDoc into the site
        run: |
          mkdir -p docs-site/public/rustdoc
          cp -R docs-site/.generated/rustdoc/doc/. docs-site/public/rustdoc/
      - name: Install site dependencies
        working-directory: docs-site
        run: pnpm install --frozen-lockfile
      - name: Check site
        working-directory: docs-site
        run: pnpm run check
      - name: Build site
        working-directory: docs-site
        run: pnpm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
